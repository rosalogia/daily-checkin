[package]
name = "daily-checkin-bot"
version = "0.1.0"
edition = "2021"

[dependencies]
serenity = { version = "0.12", default-features = false, features = [
    "builder",
    "chrono",
    "http",
    "interactions_endpoint",
    "model",
    "rustls_backend",
] }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
dotenv = "0.15"
aws-sdk-dynamodb = "1"
aws-sdk-ssm = "1"
aws-sdk-lambda = "1"
serde_dynamo = { version = "4.3.0", features = ["aws-sdk-dynamodb+1"] }
lambda_http = "1.3.1"
lambda_runtime = "1.4.0"
aws-config = { version = "1", features = ["behavior-version-latest"] }

[[bin]]
name = "interactions"
path = "src/bin/interactions.rs"

[[bin]]
name = "daily"
path = "src/bin/daily.rs"

[[bin]]
name = "register-commands"
path = "src/bin/register_commands.rs"

[[bin]]
name = "import-data"
path = "src/bin/import_data.rs"
